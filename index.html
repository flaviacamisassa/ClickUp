<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ClickUp - Petnaturau</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F7F6F2; --surface: #FFFFFF; --border: #E4E2DC; --border-strong: #C9C7BF;
    --text: #1A1916; --text-muted: #7A7870; --text-hint: #B0AEA8;
    --accent: #2D5A3D; --accent-light: #EAF2EC; --accent-text: #1E4029;
    --warn: #7A2D1E; --warn-light: #FAEDE9; --warn-text: #5A1E12;
    --info: #1A3D5C; --info-light: #E8F0F7; --info-text: #102840;
    --today: #2D4A7A; --today-light: #E8EDF7;
    --radius: 8px; --radius-lg: 12px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* Login */
  .login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
  .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 2.5rem 2rem; width: 100%; max-width: 340px; text-align: center; }
  .login-logo { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-hint); font-family: 'DM Mono', monospace; margin-bottom: 6px; }
  .login-title { font-size: 20px; font-weight: 600; color: var(--text); margin-bottom: 2rem; }
  .login-input { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius); font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--text); background: var(--bg); outline: none; transition: border-color 0.15s; text-align: center; letter-spacing: 0.1em; margin-bottom: 12px; }
  .login-input:focus { border-color: var(--border-strong); background: var(--surface); }
  .login-btn { width: 100%; padding: 10px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; margin-bottom: 10px; }
  .login-btn:hover { opacity: 0.88; }
  .login-btn-drive { width: 100%; padding: 10px; background: var(--surface); color: var(--accent-text); border: 1.5px solid var(--accent); border-radius: var(--radius); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .login-btn-drive:hover { background: var(--accent-light); }
  .login-divider { display: flex; align-items: center; gap: 10px; margin: 14px 0; color: var(--text-hint); font-size: 12px; }
  .login-divider::before, .login-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .login-error { font-size: 12px; color: var(--warn); margin-top: 10px; min-height: 18px; font-family: 'DM Mono', monospace; }

  /* Drive warning */
  .drive-warning { background: var(--warn-light); border: 1px solid #E0B8B2; border-radius: var(--radius); padding: 10px 14px; margin-bottom: 1.5rem; font-size: 13px; color: var(--warn-text); display: none; align-items: center; gap: 10px; max-width: 860px; margin-left: auto; margin-right: auto; }
  .drive-warning button { background: var(--warn); color: #fff; border: none; border-radius: var(--radius); padding: 5px 12px; font-size: 12px; cursor: pointer; font-family: 'DM Sans', sans-serif; white-space: nowrap; }

  /* App */
  .app-screen { display: none; padding: 2rem 1.5rem 4rem; }
  header { max-width: 860px; margin: 0 auto 1.5rem; display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .brand { display: flex; flex-direction: column; gap: 2px; }
  .brand-label { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-hint); font-family: 'DM Mono', monospace; }
  .brand h1 { font-size: 22px; font-weight: 600; color: var(--text); line-height: 1.2; }
  .header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .header-meta { font-size: 12px; color: var(--text-muted); font-family: 'DM Mono', monospace; display: flex; align-items: center; gap: 6px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; }

  .storage-toggle { display: flex; border: 1px solid var(--border-strong); border-radius: var(--radius); overflow: hidden; }
  .stg-btn { padding: 5px 12px; font-size: 11px; font-family: 'DM Mono', monospace; font-weight: 500; border: none; background: var(--surface); color: var(--text-muted); cursor: pointer; transition: all 0.12s; white-space: nowrap; }
  .stg-btn:first-child { border-right: 1px solid var(--border-strong); }
  .stg-btn.active-local { background: var(--bg); color: var(--text); }
  .stg-btn.active-drive { background: var(--accent-light); color: var(--accent-text); }
  .logout-btn { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--text-hint); background: none; border: 1px solid var(--border); border-radius: var(--radius); padding: 4px 10px; cursor: pointer; transition: all 0.12s; }
  .logout-btn:hover { border-color: var(--border-strong); color: var(--text-muted); }

  /* Tabs */
  .tabs-wrap { max-width: 860px; margin: 0 auto 1rem; }
  .tabs { display: flex; border-bottom: 2px solid var(--border); gap: 0; }
  .tab-btn { padding: 10px 20px; font-size: 13px; font-weight: 500; border: none; background: none; color: var(--text-muted); cursor: pointer; font-family: 'DM Sans', sans-serif; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.15s; }
  .tab-btn.active { color: var(--accent-text); border-bottom-color: var(--accent); font-weight: 600; }
  .tab-btn:hover:not(.active) { color: var(--text); }

  .main { max-width: 860px; margin: 0 auto; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow); }
  .table-header { display: grid; grid-template-columns: 1fr 36px 170px 170px 40px; padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--border); gap: 8px; }
  .th { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); font-family: 'DM Mono', monospace; display: flex; align-items: center; gap: 6px; }

  .row-wrap { border-bottom: 1px solid var(--border); }
  .row-wrap:last-child { border-bottom: none; }
  .row { display: grid; grid-template-columns: 1fr 36px 170px 170px 40px; padding: 10px 16px; gap: 8px; align-items: center; transition: background 0.12s; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  .row:hover { background: #FAFAF8; }

  /* Observações */
  .obs-btn { background: none; border: none; cursor: pointer; color: var(--text-hint); padding: 4px; border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: all 0.12s; font-size: 14px; }
  .obs-btn:hover { color: var(--accent-text); background: var(--accent-light); }
  .obs-btn.has-obs { color: var(--accent-text); }
  .obs-panel { display: none; padding: 0 16px 12px; animation: fadeIn 0.15s ease; }
  .obs-panel.open { display: block; }
  .obs-textarea { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text); background: var(--bg); outline: none; resize: vertical; min-height: 70px; transition: border-color 0.15s; line-height: 1.5; }
  .obs-textarea:focus { border-color: var(--border-strong); background: var(--surface); }
  .obs-label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-hint); font-family: 'DM Mono', monospace; margin-bottom: 6px; display: block; }

  .client-input { font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; color: var(--text); background: transparent; border: none; border-bottom: 1px solid transparent; padding: 3px 0; width: 100%; outline: none; transition: border-color 0.15s; }
  .client-input::placeholder { color: var(--text-hint); font-weight: 400; }
  .client-input:focus { border-bottom-color: var(--border-strong); }

  .date-btn { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border: 1px solid var(--border); border-radius: var(--radius); background: transparent; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 400; color: var(--text-muted); cursor: pointer; transition: all 0.12s; white-space: nowrap; width: 100%; justify-content: flex-start; }
  .date-btn:hover { border-color: var(--border-strong); color: var(--text); background: var(--bg); }
  .date-btn.has-date { color: var(--text); border-color: var(--border-strong); }
  .date-btn.proxima-date.has-date { background: var(--info-light); border-color: #B0C4D8; color: var(--info-text); font-weight: 500; }
  .date-btn.proxima-date.urgente { background: var(--warn-light); border-color: #E0B8B2; color: var(--warn-text); font-weight: 500; }
  .date-btn.proxima-date.hoje { background: var(--accent-light); border-color: #A8C8B4; color: var(--accent-text); font-weight: 500; }

  .delete-btn { background: none; border: none; cursor: pointer; color: var(--text-hint); padding: 6px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; transition: all 0.12s; }
  .delete-btn:hover { color: var(--warn); background: var(--warn-light); }

  .footer { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--bg); flex-wrap: wrap; gap: 8px; }
  .add-btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 14px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--surface); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; color: var(--text); cursor: pointer; transition: all 0.12s; }
  .add-btn:hover { background: var(--accent-light); border-color: #A8C8B4; color: var(--accent-text); }

  .save-indicator { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--text-hint); display: flex; align-items: center; gap: 5px; }
  .save-indicator.saved { color: var(--accent); }
  .save-indicator.error { color: var(--warn); }
  .save-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

  .loading-overlay { position: fixed; inset: 0; background: rgba(247,246,242,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 300; gap: 12px; }
  .loading-overlay.hidden { display: none; }
  .spinner { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 13px; color: var(--text-muted); font-family: 'DM Mono', monospace; }

  .cal-overlay { position: fixed; inset: 0; z-index: 200; display: none; }
  .cal-backdrop { position: absolute; inset: 0; }
  .cal-box { position: absolute; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-lg); padding: 14px; width: 256px; box-shadow: 0 8px 24px rgba(0,0,0,0.10); }
  .cal-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-title { font-size: 13px; font-weight: 600; color: var(--text); text-transform: capitalize; }
  .cal-nav { background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 4px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .cal-nav:hover { background: var(--bg); color: var(--text); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-lbl { text-align: center; font-size: 10px; font-weight: 600; font-family: 'DM Mono', monospace; color: var(--text-hint); padding: 3px 0 6px; text-transform: uppercase; }
  .cal-day { text-align: center; font-size: 12px; padding: 5px 2px; cursor: pointer; border-radius: 6px; color: var(--text); transition: background 0.1s; }
  .cal-day:hover { background: var(--bg); }
  .cal-day.other { color: var(--text-hint); }
  .cal-day.is-today { font-weight: 600; color: var(--today); background: var(--today-light); }
  .cal-day.selected { background: var(--accent); color: #fff; font-weight: 600; }
  .cal-actions { margin-top: 10px; }
  .cal-clear { width: 100%; padding: 6px; font-size: 12px; font-family: 'DM Sans', sans-serif; color: var(--text-muted); background: none; border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; transition: all 0.12s; }
  .cal-clear:hover { border-color: var(--warn); color: var(--warn); background: var(--warn-light); }

  .empty-state { padding: 2.5rem 1rem; text-align: center; color: var(--text-hint); font-size: 13px; display: none; }

  .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: #1A1916; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 13px; z-index: 400; opacity: 0; transition: opacity 0.25s; pointer-events: none; white-space: nowrap; font-weight: 500; font-family: 'DM Mono', monospace; }
  .toast.show { opacity: 1; }

  @media (max-width: 620px) {
    .app-screen { padding: 1.25rem 1rem 3rem; }
    .table-header, .row { grid-template-columns: 1fr 36px 130px 130px 36px; }
    .date-btn { font-size: 11px; padding: 4px 7px; }
    .tab-btn { padding: 8px 14px; font-size: 12px; }
  }
</style>
</head>
<body>

<!-- Login -->
<div class="login-screen" id="login-screen">
  <div class="login-card">
    <div class="login-logo">PetNaturau</div>
    <div class="login-title">ClickUp</div>
    <input class="login-input" type="password" id="login-input" placeholder="senha" onkeydown="if(event.key==='Enter') doLogin()" />
    <button class="login-btn" onclick="doLogin()">Entrar</button>
    <div class="login-divider">ou</div>
    <button class="login-btn-drive" onclick="doLoginWithDrive()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 18L2 12l4-6h12l4 6-4 6H6z" stroke="currentColor" stroke-width="1.5"/><path d="M12 6v12M6 18l6-6 6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      Entrar e conectar ao Drive
    </button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- App -->
<div class="app-screen" id="app-screen">
  <div class="loading-overlay hidden" id="loading">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text">carregando dados…</div>
  </div>

  <header>
    <div class="brand">
      <span class="brand-label">PetNaturau</span>
      <h1>ClickUp - Petnaturau</h1>
    </div>
    <div class="header-right">
      <div class="header-meta">
        <span class="dot"></span>
        <span id="today-label"></span>
      </div>
      <div class="storage-toggle">
        <button class="stg-btn" id="btn-local" onclick="useLocal()" title="Armazenamento local">📱 Local</button>
        <button class="stg-btn" id="btn-drive" onclick="useDrive()" title="Google Drive">☁️ Drive</button>
      </div>
      <button class="logout-btn" onclick="doLogout()">sair</button>
    </div>
  </header>

  <div id="drive-warning" class="drive-warning">
    ⚠️ Você está no modo Local — alterações não sincronizam com o Drive.
    <button onclick="useDrive()">Conectar ao Drive</button>
  </div>

  <div class="tabs-wrap">
    <div class="tabs">
      <button class="tab-btn active" id="tab-lembrar" onclick="switchTab('lembrar')">📌 Precisa lembrar</button>
      <button class="tab-btn" id="tab-automaticas" onclick="switchTab('automaticas')">🔄 Automáticas</button>
    </div>
  </div>

  <div class="main">
    <div class="card">
      <div class="table-header">
        <div class="th">Cliente</div>
        <div class="th"></div>
        <div class="th">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><rect x="2" y="3" width="12" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M5 1v4M11 1v4M2 7h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Última produção
        </div>
        <div class="th">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><rect x="2" y="3" width="12" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M5 1v4M11 1v4M2 7h12M8 10l1.5 1.5L12 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Próxima produção ↑
        </div>
        <div class="th"></div>
      </div>
      <div id="rows-container"></div>
      <div class="empty-state" id="empty">Nenhum cliente ainda. Clique em "Adicionar cliente" para começar.</div>
      <div class="footer">
        <button class="add-btn" onclick="addRow()">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Adicionar cliente
        </button>
        <div class="save-indicator" id="save-indicator">
          <div class="save-dot"></div>
          <span id="save-label">pronto</span>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="cal-overlay" id="cal-overlay">
  <div class="cal-backdrop" onclick="closeCal()"></div>
  <div class="cal-box" id="cal-box"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const PASSWORD = '8877guicury';
const SESSION_KEY = 'pn_auth';
const LOCAL_KEY = 'pn_clickup_v2';
const STORAGE_MODE_KEY = 'pn_storage_mode';
const DRIVE_FILE_NAME = 'petnaturau-clickup.json';
const CLIENT_ID = '653711423119-d9t0b6kunaaefnhec1n3t90imfss5t12.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/drive.file';

let data = { lembrar: [], automaticas: [] };
let nextId = 1;
let currentTab = 'lembrar';
let calCtx = null;
let saveTimer = null;
let storageMode = 'drive';
let driveToken = null;
let driveFileId = null;
let openObs = {};

const today = new Date();
today.setHours(0, 0, 0, 0);
const monthsFull = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const dayLabels = ['D','S','T','Q','Q','S','S'];

// ── TOAST ──────────────────────────────────────────────
function showToast(msg, dur=2500) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

// ── LOGIN ──────────────────────────────────────────────
function checkSession() {
  if (sessionStorage.getItem(SESSION_KEY) === 'ok') {
    showApp();
  }
}

function doLogin() {
  const val = document.getElementById('login-input').value;
  if (val === PASSWORD) {
    sessionStorage.setItem(SESSION_KEY, 'ok');
    document.getElementById('login-error').textContent = '';
    showApp();
  } else {
    document.getElementById('login-error').textContent = 'senha incorreta';
    document.getElementById('login-input').value = '';
    document.getElementById('login-input').focus();
  }
}

function doLoginWithDrive() {
  const val = document.getElementById('login-input').value;
  if (val !== PASSWORD && val !== '') {
    document.getElementById('login-error').textContent = 'senha incorreta';
    return;
  }
  // salva intenção de conectar ao Drive após o redirect OAuth
  sessionStorage.setItem(SESSION_KEY, 'ok');
  sessionStorage.setItem('pn_pending_drive', '1');
  redirectToDriveAuth();
}

function redirectToDriveAuth() {
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    redirect_uri: location.origin + location.pathname,
    response_type: 'token',
    scope: SCOPES,
    prompt: 'select_account'
  });
  location.href = 'https://accounts.google.com/o/oauth2/auth?' + params;
}

function doLogout() {
  sessionStorage.removeItem(SESSION_KEY);
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-input').value = '';
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  document.getElementById('today-label').textContent = today.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });

  // checar retorno OAuth
  const gotDrive = checkDriveCallback();
  if (gotDrive) return;

  // tentar restaurar token salvo
  const token = localStorage.getItem('pn_drive_token');
  const exp = parseInt(localStorage.getItem('pn_drive_token_exp') || '0');
  if (token && Date.now() < exp) {
    driveToken = token;
    storageMode = 'drive';
    updateStorageUI();
    loadData();
    return;
  }

  // sem token válido — modo local mas mostra aviso
  storageMode = 'local';
  updateStorageUI();
  showDriveWarning(true);
  loadData();
}

// ── DRIVE AUTH ─────────────────────────────────────────
function checkDriveCallback() {
  const hash = location.hash;
  if (!hash.includes('access_token')) return false;
  const p = new URLSearchParams(hash.slice(1));
  driveToken = p.get('access_token');
  const exp = Date.now() + (parseInt(p.get('expires_in') || '3600') * 1000);
  localStorage.setItem('pn_drive_token', driveToken);
  localStorage.setItem('pn_drive_token_exp', String(exp));
  localStorage.setItem(STORAGE_MODE_KEY, 'drive');
  history.replaceState(null, '', location.pathname);
  storageMode = 'drive';
  updateStorageUI();
  showDriveWarning(false);
  loadData();
  return true;
}

function useDrive() {
  if (storageMode === 'drive' && driveToken) {
    if (confirm('Desconectar do Google Drive?')) {
      driveToken = null; driveFileId = null;
      localStorage.removeItem('pn_drive_token');
      localStorage.removeItem('pn_drive_token_exp');
      storageMode = 'local';
      localStorage.setItem(STORAGE_MODE_KEY, 'local');
      updateStorageUI();
      showDriveWarning(true);
      showToast('Desconectado do Drive');
    }
    return;
  }
  redirectToDriveAuth();
}

function useLocal() {
  if (storageMode === 'local') return;
  if (confirm('Trocar para Local? Alterações não sincronizarão com o Drive.')) {
    storageMode = 'local';
    localStorage.setItem(STORAGE_MODE_KEY, 'local');
    updateStorageUI();
    showDriveWarning(true);
    showToast('📱 Modo local ativado');
  }
}

function updateStorageUI() {
  const btnLocal = document.getElementById('btn-local');
  const btnDrive = document.getElementById('btn-drive');
  if (storageMode === 'drive') {
    btnLocal.className = 'stg-btn';
    btnDrive.className = 'stg-btn active-drive';
    btnDrive.textContent = '☁️ Drive ✓';
  } else {
    btnLocal.className = 'stg-btn active-local';
    btnDrive.className = 'stg-btn';
    btnDrive.textContent = '☁️ Drive';
  }
}

function showDriveWarning(show) {
  const el = document.getElementById('drive-warning');
  el.style.display = show ? 'flex' : 'none';
}

// ── CARREGAR ───────────────────────────────────────────
async function loadData() {
  showLoading('carregando dados…');
  if (storageMode === 'drive' && driveToken) {
    await loadFromDrive();
  } else {
    loadFromLocal();
  }
  hideLoading();
  render();
}

function loadFromLocal() {
  try {
    const raw = localStorage.getItem(LOCAL_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      data = saved.data || { lembrar: [], automaticas: [] };
      nextId = saved.nextId || 1;
      if (!data.lembrar) data.lembrar = [];
      if (!data.automaticas) data.automaticas = [];
      if (data.lembrar.length === 0 && data.automaticas.length === 0) initEmptyRows();
    } else {
      initEmptyRows();
    }
    setSaveState('saved', storageMode === 'drive' ? 'drive' : 'local');
  } catch(e) { initEmptyRows(); setSaveState('error', 'erro'); }
}

async function loadFromDrive() {
  try {
    showLoading('conectando ao Drive…');
    const searchRes = await fetch(
      `https://www.googleapis.com/drive/v3/files?q=name='${DRIVE_FILE_NAME}'+and+trashed=false&spaces=drive&fields=files(id,name)`,
      { headers: { Authorization: `Bearer ${driveToken}` } }
    );
    const searchData = await searchRes.json();
    if (searchData.files && searchData.files.length > 0) {
      driveFileId = searchData.files[0].id;
      showLoading('lendo dados do Drive…');
      const fileRes = await fetch(
        `https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`,
        { headers: { Authorization: `Bearer ${driveToken}` } }
      );
      const saved = await fileRes.json();
      data = saved.data || { lembrar: [], automaticas: [] };
      nextId = saved.nextId || 1;
      if (!data.lembrar) data.lembrar = [];
      if (!data.automaticas) data.automaticas = [];
      if (data.lembrar.length === 0 && data.automaticas.length === 0) initEmptyRows();
      setSaveState('saved', 'drive');
      showDriveWarning(false);
      showToast('☁️ Dados carregados do Drive!');
    } else {
      initEmptyRows();
      await saveToDrive();
    }
  } catch(e) {
    console.error(e);
    loadFromLocal();
    showToast('⚠️ Drive indisponível, usando local');
    storageMode = 'local';
    updateStorageUI();
    showDriveWarning(true);
  }
}

// ── SALVAR ─────────────────────────────────────────────
async function saveData() {
  collectInputValues();
  if (storageMode === 'drive' && driveToken) {
    await saveToDrive();
  } else {
    saveToLocal();
  }
}

function saveToLocal() {
  try {
    localStorage.setItem(LOCAL_KEY, JSON.stringify({ data, nextId }));
    setSaveState('saved', 'local');
  } catch(e) { setSaveState('error', 'erro local'); }
}

async function saveToDrive() {
  setSaveState('saving', 'salvando…');
  try {
    const body = JSON.stringify({ data, nextId });
    localStorage.setItem(LOCAL_KEY, body);
    if (driveFileId) {
      await fetch(
        `https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`,
        { method: 'PATCH', headers: { Authorization: `Bearer ${driveToken}`, 'Content-Type': 'application/json' }, body }
      );
    } else {
      const metaRes = await fetch(
        'https://www.googleapis.com/drive/v3/files',
        { method: 'POST', headers: { Authorization: `Bearer ${driveToken}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: DRIVE_FILE_NAME, mimeType: 'application/json' }) }
      );
      const meta = await metaRes.json();
      driveFileId = meta.id;
      await fetch(
        `https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`,
        { method: 'PATCH', headers: { Authorization: `Bearer ${driveToken}`, 'Content-Type': 'application/json' }, body }
      );
    }
    setSaveState('saved', 'drive');
  } catch(e) { setSaveState('error', 'erro drive'); showToast('⚠️ Erro ao salvar no Drive'); }
}

function debounceSave() {
  setSaveState('saving', 'salvando…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveData, 1200);
}

function collectInputValues() {
  ['lembrar','automaticas'].forEach(tab => {
    data[tab].forEach(r => {
      const el = document.getElementById('ci-' + r.id);
      if (el) r.client = el.value;
      const obsEl = document.getElementById('obs-' + r.id);
      if (obsEl) r.obs = obsEl.value;
    });
  });
}

// ── HELPERS ────────────────────────────────────────────
function showLoading(msg) { document.getElementById('loading').classList.remove('hidden'); document.getElementById('loading-text').textContent = msg; }
function hideLoading() { document.getElementById('loading').classList.add('hidden'); }
function setSaveState(state, label) {
  const ind = document.getElementById('save-indicator');
  const lbl = document.getElementById('save-label');
  ind.className = 'save-indicator ' + state;
  lbl.textContent = ({ saved: '✓', saving: '…', error: '!' }[state] || '') + ' ' + label;
}
function initEmptyRows() {
  data = {
    lembrar: [{ id: nextId++, client: '', ultima: null, proxima: null, obs: '' }, { id: nextId++, client: '', ultima: null, proxima: null, obs: '' }],
    automaticas: [{ id: nextId++, client: '', ultima: null, proxima: null, obs: '' }, { id: nextId++, client: '', ultima: null, proxima: null, obs: '' }]
  };
}

// ── TABS ───────────────────────────────────────────────
function switchTab(tab) {
  collectInputValues();
  currentTab = tab;
  document.getElementById('tab-lembrar').className = 'tab-btn' + (tab === 'lembrar' ? ' active' : '');
  document.getElementById('tab-automaticas').className = 'tab-btn' + (tab === 'automaticas' ? ' active' : '');
  openObs = {};
  render();
}

// ── DATAS ──────────────────────────────────────────────
function formatDate(d) {
  if (!d) return null;
  return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear();
}
function parseDate(s) {
  if (!s) return null;
  if (s.includes('T')) { const d = new Date(s); return isNaN(d) ? null : d; }
  const parts = s.split('/');
  if (parts.length !== 3) return null;
  return new Date(+parts[2], +parts[1] - 1, +parts[0]);
}

// ── RENDER ─────────────────────────────────────────────
function getSortedRows() {
  const rows = data[currentTab] || [];
  return [...rows].sort((a, b) => {
    const da = parseDate(a.proxima), db = parseDate(b.proxima);
    // sem data vai para o final
    if (!da && !db) return 0;
    if (!da) return 1;
    if (!db) return -1;
    return da - db;
  });
}

function getProximaState(s) {
  if (!s) return '';
  const d = parseDate(s); if (!d) return '';
  const diff = Math.round((d - today) / 86400000);
  if (diff < 0) return 'urgente';
  if (diff === 0) return 'hoje';
  if (diff <= 3) return 'urgente';
  return 'has-date';
}

function addRow() {
  collectInputValues();
  data[currentTab].push({ id: nextId++, client: '', ultima: null, proxima: null, obs: '' });
  render(); debounceSave();
  const inputs = document.querySelectorAll('.client-input');
  if (inputs.length) inputs[inputs.length - 1].focus();
}

function deleteRow(id) {
  collectInputValues();
  data[currentTab] = data[currentTab].filter(r => r.id !== id);
  delete openObs[id];
  render(); saveData();
}

function toggleObs(id) {
  collectInputValues();
  openObs[id] = !openObs[id];
  render();
  if (openObs[id]) {
    setTimeout(() => {
      const el = document.getElementById('obs-' + id);
      if (el) el.focus();
    }, 50);
  }
}

function render() {
  const container = document.getElementById('rows-container');
  const empty = document.getElementById('empty');
  const sorted = getSortedRows();
  empty.style.display = sorted.length === 0 ? 'block' : 'none';
  container.innerHTML = '';
  sorted.forEach(row => {
    const wrap = document.createElement('div');
    wrap.className = 'row-wrap';

    const proxState = getProximaState(row.proxima);
    const isObsOpen = !!openObs[row.id];
    const hasObs = !!(row.obs && row.obs.trim());

    const rowDiv = document.createElement('div');
    rowDiv.className = 'row';
    rowDiv.innerHTML = `
      <div><input class="client-input" id="ci-${row.id}" type="text" placeholder="Nome do cliente…" value="${escHtml(row.client)}" oninput="onClientInput(${row.id})" autocomplete="off" /></div>
      <div>
        <button class="obs-btn ${hasObs ? 'has-obs' : ''}" onclick="toggleObs(${row.id})" title="${isObsOpen ? 'Fechar observações' : 'Ver/editar observações'}">
          ${isObsOpen ? '📝' : (hasObs ? '📝' : '💬')}
        </button>
      </div>
      <div>
        <button class="date-btn ${row.ultima ? 'has-date' : ''}" onclick="openCal(event,${row.id},'ultima')">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><rect x="2" y="3" width="12" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M5 1v4M11 1v4M2 7h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          ${row.ultima || 'Selecionar'}
        </button>
      </div>
      <div>
        <button class="date-btn proxima-date ${proxState ? 'has-date' : ''} ${proxState}" onclick="openCal(event,${row.id},'proxima')">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><rect x="2" y="3" width="12" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M5 1v4M11 1v4M2 7h12M8 10l1.5 1.5L12 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          ${row.proxima || 'Selecionar'}
        </button>
      </div>
      <div>
        <button class="delete-btn" onclick="deleteRow(${row.id})" title="Remover">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 4h10M6 4V2h4v2M13 4l-1 10H4L3 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    `;
    wrap.appendChild(rowDiv);

    // Painel de observações
    const obsDiv = document.createElement('div');
    obsDiv.className = 'obs-panel' + (isObsOpen ? ' open' : '');
    obsDiv.innerHTML = `
      <span class="obs-label">Observações — ${escHtml(row.client) || 'cliente'}</span>
      <textarea class="obs-textarea" id="obs-${row.id}" placeholder="Digite observações sobre este cliente…" oninput="onObsInput(${row.id})">${escHtml(row.obs || '')}</textarea>
    `;
    wrap.appendChild(obsDiv);
    container.appendChild(wrap);
  });
}

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function onClientInput(id) {
  const row = data[currentTab].find(r => r.id === id);
  if (row) row.client = document.getElementById('ci-' + id).value;
  debounceSave();
}

function onObsInput(id) {
  const row = data[currentTab].find(r => r.id === id);
  if (row) row.obs = document.getElementById('obs-' + id).value;
  debounceSave();
}

// ── CALENDÁRIO ─────────────────────────────────────────
function openCal(e, rowId, field) {
  e.stopPropagation(); collectInputValues();
  const row = data[currentTab].find(r => r.id === rowId);
  const existing = row[field] ? parseDate(row[field]) : null;
  const rect = e.currentTarget.getBoundingClientRect();
  calCtx = { rowId, field, year: existing ? existing.getFullYear() : today.getFullYear(), month: existing ? existing.getMonth() : today.getMonth() };
  const box = document.getElementById('cal-box');
  let top = rect.bottom + window.scrollY + 6;
  let left = rect.left + window.scrollX;
  if (left + 256 > window.innerWidth - 12) left = window.innerWidth - 256 - 12;
  if (top + 300 > window.scrollY + window.innerHeight) top = rect.top + window.scrollY - 310;
  box.style.top = top + 'px'; box.style.left = Math.max(8, left) + 'px';
  document.getElementById('cal-overlay').style.display = 'block';
  renderCal(existing);
}

function closeCal() { document.getElementById('cal-overlay').style.display = 'none'; calCtx = null; }

function renderCal(selected) {
  const { year, month } = calCtx;
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const daysInPrev = new Date(year, month, 0).getDate();
  let cells = dayLabels.map(d => `<div class="cal-lbl">${d}</div>`).join('');
  for (let i = 0; i < firstDay; i++) {
    const d = daysInPrev - firstDay + 1 + i;
    cells += `<div class="cal-day other" onclick="selectDate(${year},${month-1},${d})">${d}</div>`;
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const isToday = d === today.getDate() && month === today.getMonth() && year === today.getFullYear();
    const isSel = selected && d === selected.getDate() && month === selected.getMonth() && year === selected.getFullYear();
    const cls = (isToday ? ' is-today' : '') + (isSel ? ' selected' : '');
    cells += `<div class="cal-day${cls}" onclick="selectDate(${year},${month},${d})">${d}</div>`;
  }
  const tail = 42 - firstDay - daysInMonth;
  for (let d = 1; d <= tail; d++) cells += `<div class="cal-day other" onclick="selectDate(${year},${month+1},${d})">${d}</div>`;
  document.getElementById('cal-box').innerHTML = `
    <div class="cal-top">
      <button class="cal-nav" onclick="navCal(-1)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M10 3L6 8l4 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="cal-title">${monthsFull[month]} ${year}</div>
      <button class="cal-nav" onclick="navCal(1)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M6 3l4 5-4 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-actions"><button class="cal-clear" onclick="clearDate()">Limpar data</button></div>
  `;
}

function navCal(dir) {
  calCtx.month += dir;
  if (calCtx.month > 11) { calCtx.month = 0; calCtx.year++; }
  if (calCtx.month < 0) { calCtx.month = 11; calCtx.year--; }
  const row = data[currentTab].find(r => r.id === calCtx.rowId);
  renderCal(row[calCtx.field] ? parseDate(row[calCtx.field]) : null);
}

function selectDate(year, month, day) {
  const d = new Date(year, month, day);
  const row = data[currentTab].find(r => r.id === calCtx.rowId);
  if (row) { row[calCtx.field] = formatDate(d); closeCal(); render(); saveData(); }
}

function clearDate() {
  const row = data[currentTab].find(r => r.id === calCtx.rowId);
  if (row) { row[calCtx.field] = null; closeCal(); render(); saveData(); }
}

// ── INIT ───────────────────────────────────────────────
checkSession();
</script>
